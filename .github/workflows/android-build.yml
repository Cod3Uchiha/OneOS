name: Android build

concurrency:
  group: oneos-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, qemu-arm64-engine, feat/standalone-qemu-android]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OneOS
        uses: actions/checkout@v4

      - name: Checkout pinned Android QEMU build recipe
        uses: actions/checkout@v4
        with:
          repository: ExTV/Podroid
          ref: e3fc1befa3c135d28bf8d40e3c2264d93fea87ef
          path: .qemu-builder

      - name: Build upstream QEMU for Android ARM64
        run: |
          docker build \
            --file .qemu-builder/Dockerfile \
            --target qemu-builder \
            --build-arg QEMU_VERSION=11.1.2 \
            --tag oneos-qemu-android-builder \
            .qemu-builder

      - name: Package QEMU runtime
        run: |
          set -euo pipefail
          mkdir -p app-android/app/src/main/jniLibs/arm64-v8a app-android/app/src/main/assets/bin
          cid="$(docker create oneos-qemu-android-builder)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/opt/qemu-out/libqemu-system-aarch64.so" app-android/app/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so
          docker cp "$cid:/opt/qemu-out/libslirp.so" app-android/app/src/main/jniLibs/arm64-v8a/libslirp.so
          docker cp "$cid:/opt/qemu-out/bin/qemu-img" app-android/app/src/main/assets/bin/qemu-img
          chmod 755 app-android/app/src/main/assets/bin/qemu-img
          readelf -h app-android/app/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so | grep -q AArch64
          readelf -h app-android/app/src/main/jniLibs/arm64-v8a/libslirp.so | grep -q AArch64
          readelf -h app-android/app/src/main/assets/bin/qemu-img | grep -q AArch64

      - name: Install ARM64 UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-efi-aarch64
          firmware_code="$(find /usr/share -type f \\( -iname 'AAVMF_CODE.fd' -o -iname 'QEMU_EFI.fd' \\) -print -quit)"
          firmware_vars="$(find /usr/share -type f \\( -iname 'AAVMF_VARS.fd' -o -iname 'QEMU_VARS.fd' \\) -print -quit)"
          test -n "$firmware_code"
          test -n "$firmware_vars"
          mkdir -p app-android/app/src/main/assets/firmware
          cp "$firmware_code" app-android/app/src/main/assets/firmware/UEFI_CODE.fd
          cp "$firmware_vars" app-android/app/src/main/assets/firmware/UEFI_VARS.fd
          test -s app-android/app/src/main/assets/firmware/UEFI_CODE.fd
          test -s app-android/app/src/main/assets/firmware/UEFI_VARS.fd

      - name: Package noVNC display client
        run: |
          git clone --depth 1 --branch v1.5.0 https://github.com/novnc/noVNC.git /tmp/noVNC
          mkdir -p app-android/app/src/main/assets/novnc
          cp -a /tmp/noVNC/vnc.html /tmp/noVNC/app /tmp/noVNC/core /tmp/noVNC/vendor /tmp/noVNC/utils app-android/app/src/main/assets/novnc/
          cp /tmp/noVNC/LICENSE.txt app-android/app/src/main/assets/novnc/LICENSE.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"

      - name: Build debug APK
        working-directory: app-android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: oneos-standalone-qemu-arm64-debug
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
